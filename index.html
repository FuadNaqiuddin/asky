<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>hi yem</title>
</head>

<body>
    <div class="container">

        <div class="card card-body text-center custom-card">
            
            <h1 class="header_text">do you wanna go out with me?</h1>
            
            <div class="gif_container">
                
                <img src="pics/cute.png" alt="please cat" width="200" height="200" />

            </div>

            <div class="buttons">
                <button class="btn" id="yesButton" onclick="nextPage()">yes i'd love to</button>
                <button class="btn" id="noButton" onmouseover="moveButton()" onclick="moveButton()">
              no
            </button>

                <script>
                    function nextPage() {
                        window.location.href = "yes.html";
                    }

                    function moveButton() {
                        var button = document.getElementById("noButton");

                        var maxX = window.innerWidth - button.offsetWidth;
                        var maxY = window.innerHeight - button.offsetHeight;

                        var x = Math.random() * maxX;
                        var y = Math.random() * maxY;

                        button.style.position = "fixed";
                        button.style.left = `${x}px`;
                        button.style.top = `${y}px`;
                    }
                </script>
            </div>
        </div>
    </div>
</body>

</html>
