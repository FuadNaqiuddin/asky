<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <title>hi yem</title>
</head>

<body>
    <div class="container">

        <div class="card card-body text-center custom-card">
            
            <h1 class="header_text">do you wanna go out with me?</h1>
            
            <div class="gif_container">
                <!-- <img src="https://i.postimg.cc/pdNqPxx1/milk-and-mocha-cute.gif" alt="Cute animated illustration" /> -->

                <!-- <img href="https://www.flaticon.com/free-stickers/please" title="please stickers" alt="Please stickers created by MrHamster - Flaticon"/> -->
                <img src="pics/cute.png" alt="please cat" width="200" height="200" />

            </div>

            <div class="buttons">
                <button class="btn" id="yesButton" onclick="nextPage()">yes i'd love to</button>
                <button class="btn" id="noButton" onmouseover="moveButton()" onclick="moveButton()">
              no
            </button>

                <script>
                    function nextPage() {
                        window.location.href = "yes.html";
                    }

                    function moveButton() {
                        var x =
                            Math.random() *
                            (window.innerWidth -
                                document.getElementById("noButton").offsetWidth);
                        var y =
                            Math.random() *
                            (window.innerHeight -
                                document.getElementById("noButton").offsetHeight);
                        document.getElementById("noButton").style.left = `${x}px`;
                        document.getElementById("noButton").style.top = `${y}px`;
                    }
                </script>
            </div>
        </div>
    </div>
</body>

</html>
