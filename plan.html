<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.10.0/css/bootstrap-datepicker.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.10.0/js/bootstrap-datepicker.min.js"></script>

    <title>6 7</title>
</head>

<body>
    <div class="container">
        <div class="card card-body text-center custom-card">
            <h1 class="header_text">when works for you?</h1>

            <div class="date-container">
                <label for="datePicker">date</label>
                <input
                    type="text"
                    id="datePicker"
                    class="form-control"
                    placeholder="choose date"
                    readonly
                />
            </div>

            <div class="time-container">
                <label for="timePicker">time</label>
                <input
                    type="time"
                    id="timePicker"
                    class="form-control"
                />
            </div>

            <div class="activity-container">
                <label for="activityPicker">activity</label>
                <input
                    type="text"
                    id="activityPicker"
                    class="form-control"
                    placeholder="i'll decide :p" 
                    aria-label="Disabled input example" 
                    disabled
                />
            </div>


            <button class="btn" id="seeBtn" onclick="showDateModal()">
            see you! 
            </button>

            <div class="modal fade" id="dateModal"
                 data-bs-backdrop="static"
                 data-bs-keyboard="false"
                 tabindex="-1"
                 aria-labelledby="dateModalLabel"
                 aria-hidden="true">

                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">

                        <!-- <div class="modal-header">
                            <h5 class="modal-title" id="dateModalLabel">
                                it's a date!!
                            </h5>
                        </div> -->

                        <div class="gif_container2">
                            <img src="pics/happy.png" alt="happy cat" width="200" height="200" />
                        </div>

                        <div class="modal-body text-center">
                            <h4>can't wait to see you! </h4>

                            <p class="modal-msg">our date will be on:</p>

                            <h5 id="confirmedDate"></h5>
                            <h5 id="confirmedTime"></h5>

                            <p class="date-msg">screen shot & send it to me! :)</p>
                        </div>

                        <!-- <div class="modal-footer justify-content-center">
                            <button type="button" class="btn"
                                    data-bs-dismiss="modal">
                                yayyy! 💗
                            </button>
                        </div> -->

                    </div>
                </div>
            </div>

    <script type="text/javascript">
        $(document).ready(function () {
            $('#datePicker').datepicker({
                format: 'dd/mm/yyyy',
                autoclose: true,
                todayHighlight: true,
                startDate: new Date()
            });
        });

        // function nextPage() {
        // const selectedDate = document.getElementById("datePicker").value;
        // const selectedTime = document.getElementById("timePicker").value;

        // if (!selectedDate || !selectedTime) {
        //     alert("please choose date & time first!");
        //     return;
        // }

        // // Save selected date
        // localStorage.setItem("date", selectedDate);
        // localStorage.setItem("time", selectedTime);

        // // Go to next page
        // window.location.href = "next.html";
        // }

        function showDateModal() {
            const selectedDate = document.getElementById("datePicker").value;
            const selectedTime = document.getElementById("timePicker").value;

            if (!selectedDate || !selectedTime) {
                alert("please choose date & time first! :(");
                return;
            }

            // Format date
            const dateParts = selectedDate.split("/");
            const formattedDate = new Date(
                dateParts[2],
                dateParts[1] - 1,
                dateParts[0]
            );

            const dateOptions = {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            };

            document.getElementById("confirmedDate").textContent =
                formattedDate.toLocaleDateString("en-GB", dateOptions);

            // Format time
            const timeParts = selectedTime.split(":");
            const formattedTime = new Date();

            formattedTime.setHours(timeParts[0], timeParts[1]);

            document.getElementById("confirmedTime").textContent =
                formattedTime.toLocaleTimeString("en-US", {
                    hour: "numeric",
                    minute: "2-digit",
                    hour12: true
                });

            // Show modal
            const modalElement = document.getElementById("dateModal");
            const dateModal = new bootstrap.Modal(modalElement);

            dateModal.show();
        }

    </script>
      
      </div>
    </div>
</body>

</html>
